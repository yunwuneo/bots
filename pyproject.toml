[project]
name = "neobots"
version = "0.1.0"
description = "A personal team of persistent agents with a shared computer"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
computer = ["playwright>=1.58,<2"]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

